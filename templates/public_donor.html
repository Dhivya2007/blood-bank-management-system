<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Blood Donor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #c31432, #240b36); min-height: 100vh; }
        .card { border-radius: 1.5rem; margin-top: 2rem; margin-bottom: 2rem; }
        .btn-blood { background: #c31432; color: white; border-radius: 2rem; }
        .btn-blood:hover { background: #a00f28; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <div class="text-center">
                    <i class="fas fa-tint fa-3x text-danger"></i>
                    <h2>Register as Blood Donor</h2>
                    <p class="text-muted">Join us in saving lives</p>
                </div>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endwith %}
                <form method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Full Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Age</label>
                            <input type="number" name="age" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Gender</label>
                            <select name="gender" class="form-control">
                                <option>Male</option><option>Female</option><option>Other</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Blood Group</label>
                            <input type="text" name="blood_group" placeholder="e.g., O+, A-" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Phone Number</label>
                            <input type="text" name="phone" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Address</label>
                            <input type="text" name="address" class="form-control">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-blood w-100">Register as Donor</button>
                </form>
                <div class="text-center mt-3">
                    <a href="/">Back to Home</a> | 
                    <a href="/request_blood">Request Blood Instead</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
