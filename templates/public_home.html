<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blood Bank | Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #c31432, #240b36); min-height: 100vh; display: flex; align-items: center; }
        .card { border-radius: 1.5rem; }
        .btn-blood { background: #c31432; color: white; border-radius: 2rem; padding: 12px; }
        .btn-blood:hover { background: #a00f28; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 text-center">
                <i class="fas fa-tint fa-4x text-danger mb-3"></i>
                <h1>Blood Bank Management</h1>
                <p class="lead">Saving lives, one donation at a time</p>
                <div class="d-grid gap-3 mt-4">
                    <a href="/register_donor" class="btn btn-blood btn-lg"><i class="fas fa-user-plus"></i> Register as Donor</a>
                    <a href="/request_blood" class="btn btn-outline-danger btn-lg"><i class="fas fa-procedures"></i> Request Blood</a>
                    <a href="/login" class="btn btn-secondary btn-lg"><i class="fas fa-lock"></i> Staff Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
