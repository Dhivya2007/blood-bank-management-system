{% extends "base.html" %}
{% block content %}
<h2>Add New Patient</h2>
<form method="post">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label>Patient ID (unique number)</label>
            <input type="number" name="patient_id" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
            <label>Full Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
            <label>Age</label>
            <input type="number" name="age" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
            <label>Gender</label>
            <select name="gender" class="form-control">
                <option>Male</option><option>Female</option><option>Other</option>
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label>Blood Group</label>
            <input type="text" name="blood_group" placeholder="e.g., O+, A-" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
            <label>Hospital Name</label>
            <input type="text" name="hospital_name" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
            <label>Phone</label>
            <input type="text" name="phone" class="form-control" required>
        </div>
    </div>
    <button type="submit" class="btn btn-success">Save Patient</button>
    <a href="/patients" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
