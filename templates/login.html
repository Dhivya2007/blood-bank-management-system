<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bank Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #c31432, #240b36);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            border-radius: 1.5rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            border: none;
        }
        .btn-blood {
            background: #c31432;
            color: white;
            border-radius: 2rem;
        }
        .btn-blood:hover { background: #a00f28; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <div class="text-center mb-3">
                    <i class="fas fa-tint fa-3x text-danger"></i>
                    <h3 class="mt-2">Blood Bank Portal</h3>
                </div>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endwith %}
                <form method="post">
                    <div class="mb-3">
                        <label>Email (Username)</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Phone (Password)</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-blood w-100">Login</button>
                </form>
                <div class="mt-3 text-center small text-muted">Use Staff email/phone (e.g., staff@hospital.com / 9876543210)</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
