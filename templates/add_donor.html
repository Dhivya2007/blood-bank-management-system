{% extends "base.html" %}
{% block content %}
<h2>Add New Donor</h2>
<form method="post">
    <div class="row">
        <div class="col-md-6 mb-3"><label>Name</label><input type="text" name="name" class="form-control" required></div>
        <div class="col-md-6 mb-3"><label>Age</label><input type="number" name="age" class="form-control" required></div>
        <div class="col-md-6 mb-3"><label>Gender</label><select name="gender" class="form-control"><option>Male</option><option>Female</option><option>Other</option></select></div>
        <div class="col-md-6 mb-3"><label>Blood Group</label><input type="text" name="blood_group" class="form-control" required></div>
        <div class="col-md-6 mb-3"><label>Phone</label><input type="text" name="phone" class="form-control" required></div>
        <div class="col-md-6 mb-3"><label>Address</label><input type="text" name="address" class="form-control"></div>
        <div class="col-md-6 mb-3"><label>Last Donation Date</label><input type="date" name="last_donation" class="form-control"></div>
    </div>
    <button type="submit" class="btn btn-primary">Save Donor</button>
</form>
{% endblock %}
