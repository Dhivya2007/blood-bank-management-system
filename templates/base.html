<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blood Bank System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .sidebar { background: #f8f9fa; min-height: 100vh; }
        .nav-link { color: #333; }
        .nav-link.active { background: #c31432; color: white; border-radius: 0.5rem; }
        .navbar-blood { background: #c31432; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-3">
            <h5 class="text-danger"><i class="fas fa-tint"></i> Blood Bank</h5>
            <hr>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li class="nav-item"><a href="/donors" class="nav-link"><i class="fas fa-users"></i> Donors</a></li>
                <li class="nav-item"><a href="/patients" class="nav-link"><i class="fas fa-procedures"></i> Patients</a></li>
                <li class="nav-item"><a href="/requests" class="nav-link"><i class="fas fa-hand-holding-heart"></i> Blood Requests</a></li>
                <li class="nav-item"><a href="/blood_units" class="nav-link"><i class="fas fa-droplet"></i> Blood Units</a></li>
                <li class="nav-item"><a href="/staff" class="nav-link"><i class="fas fa-user-md"></i> Staff</a></li>
                <li class="nav-item"><a href="/logout" class="nav-link text-danger"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
        <div class="col-md-10 p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                {% endfor %}
            {% endwith %}
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
